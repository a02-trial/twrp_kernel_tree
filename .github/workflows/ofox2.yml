name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '11.0'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/a02-trial/twrp_kernel_tree'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'

jobs:
  build:
    name: Build OFRP
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean Runner
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space 12GB
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts && sudo bash setup/android_build_env.sh

    - name: Sync OrangeFox Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        cd sync
        ./orangefox_sync.sh \
          --branch ${{ inputs.MANIFEST_BRANCH }} \
          --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} \
          -b ${{ inputs.DEVICE_TREE_BRANCH }} \
          ./device_tree
        # Extract device info dari .mk
        cd device_tree
        BRAND=$(grep -m1 'PRODUCT_BRAND' *.mk | sed 's/.*:=\s*//')
        CODENAME=$(grep -m1 'PRODUCT_DEVICE' *.mk | sed 's/.*:=\s*//')
        echo "DEVICE_NAME=${CODENAME}" >> $GITHUB_ENV
        echo "DEVICE_BRAND=${BRAND}" >> $GITHUB_ENV
        cd ../
        mkdir -p device/${BRAND}
        mv device_tree device/${BRAND}/${CODENAME}

    - name: Build OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        lunch twrp_${{ env.DEVICE_NAME }}-eng
        make clean
        mka adbd recoveryimage

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
        name: "OrangeFox - ${{ env.DEVICE_NAME }}"
        tag_name: ${{ github.run_id }}
        body: |
          Branch: ${{ inputs.MANIFEST_BRANCH }}
          Device: ${{ env.DEVICE_NAME }}
          Built by: ${{ github.actor }}
