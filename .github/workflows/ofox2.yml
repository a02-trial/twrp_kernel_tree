name: Build OrangeFox Recovery

on:
  workflow_dispatch:
    inputs:
      MANIFEST_BRANCH:
        description: 'OrangeFox Branch'
        required: true
        default: '11.0'
        type: choice
        options:
        - 12.1
        - 11.0
      DEVICE_TREE:
        description: 'Device Tree URL'
        required: true
        default: 'https://github.com/a02-trial/twrp_kernel_tree'
      DEVICE_TREE_BRANCH:
        description: 'Device Tree Branch'
        required: true
        default: 'main'

jobs:
  build:
    name: Build OFRP
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Clean Runner
      uses: rokibhasansagar/slimhub_actions@main

    - name: Swap Space 12GB
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 12

    - name: Build Environment
      run: |
        sudo apt install aria2 -y
        git clone https://gitlab.com/OrangeFox/misc/scripts
        cd scripts && sudo bash setup/android_build_env.sh

    - name: Cache Python 2.7
      id: cache-python2
      uses: actions/cache@v4
      with:
        path: |
          /usr/local/bin/python2.7
          /usr/local/lib/python2.7
          /usr/local/include/python2.7
        key: ${{ runner.os }}-python-2.7.18

    - name: Installing python2 for legacy builds
      if: inputs.MANIFEST_BRANCH != '12.1' && steps.cache-python2.outputs.cache-hit != 'true'
      run: |
        cd /tmp
        wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
        tar xzf Python-2.7.18.tgz
        cd Python-2.7.18
        ./configure --enable-optimizations
        make -j$(nproc)
        sudo make install

    - name: Setup Python2 Symlinks
      if: inputs.MANIFEST_BRANCH != '12.1'
      run: |
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python
        sudo ln -sf /usr/local/bin/python2.7 /usr/bin/python2
        python2 --version

    - name: Sync OrangeFox Manifest
      run: |
        mkdir -p ${GITHUB_WORKSPACE}/OrangeFox
        cd ${GITHUB_WORKSPACE}/OrangeFox
        git config --global user.name "github-actions"
        git config --global user.email "actions@github.com"
        git clone https://gitlab.com/OrangeFox/sync.git
        if [ "${{ inputs.MANIFEST_BRANCH }}" == "12.1" ]; then
          echo "Syncing modern branch: ${{ inputs.MANIFEST_BRANCH }}"
          cd sync
          ./orangefox_sync.sh \
            --branch ${{ inputs.MANIFEST_BRANCH }} \
            --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        else
          echo "Syncing legacy branch: ${{ inputs.MANIFEST_BRANCH }}"
          cd sync/legacy
          ./orangefox_sync_legacy.sh \
            --branch ${{ inputs.MANIFEST_BRANCH }} \
            --path ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        fi

    - name: Clone Device Tree
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        git clone ${{ inputs.DEVICE_TREE }} \
          -b ${{ inputs.DEVICE_TREE_BRANCH }} \
          ./device_tree
        cd device_tree
        BRAND=$(grep -m1 'PRODUCT_BRAND' *.mk | sed 's/.*:=\s*//')
        CODENAME=$(grep -m1 'PRODUCT_DEVICE' *.mk | sed 's/.*:=\s*//')
        echo "DEVICE_NAME=${CODENAME}" >> $GITHUB_ENV
        echo "DEVICE_BRAND=${BRAND}" >> $GITHUB_ENV
        cd ../
        mkdir -p device/${BRAND}
        mv device_tree device/${BRAND}/${CODENAME}

    - name: Build OrangeFox
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        set +e
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        set -e
        if [ "${{ inputs.MANIFEST_BRANCH }}" == "12.1" ]; then
          lunch twrp_${{ env.DEVICE_NAME }}-eng
        else
          lunch omni_${{ env.DEVICE_NAME }}-eng
        fi
        make clean
        mka adbd recoveryimage

    - name: Check Build Result
      run: |
        cd ${GITHUB_WORKSPACE}/OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}
        if [ -f out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img ]; then
          echo "CHECK_IMG_IS_OK=true" >> $GITHUB_ENV
          echo "MD5_IMG=$(md5sum out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img | cut -d ' ' -f 1)" >> $GITHUB_ENV
        else
          echo "Recovery image not found!"
          exit 1
        fi
        if [ -f out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip ]; then
          echo "CHECK_ZIP_IS_OK=true" >> $GITHUB_ENV
          echo "MD5_ZIP=$(md5sum out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip | cut -d ' ' -f 1)" >> $GITHUB_ENV
        fi

    - name: Set Build Date
      run: echo "BUILD_DATE=$(TZ=Asia/Jakarta date +%Y%m%d)" >> $GITHUB_ENV

    - name: Upload to Release
      uses: softprops/action-gh-release@master
      with:
        files: |
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.img
          OrangeFox/fox_${{ inputs.MANIFEST_BRANCH }}/out/target/product/${{ env.DEVICE_NAME }}/OrangeFox*.zip
        name: "OrangeFox ${{ inputs.MANIFEST_BRANCH }} - ${{ env.DEVICE_NAME }} // ${{ env.BUILD_DATE }}"
        tag_name: ${{ github.run_id }}
        body: |
          Branch : ${{ inputs.MANIFEST_BRANCH }}
          Device : ${{ env.DEVICE_NAME }}
          Built by : ${{ github.actor }}
          MD5 (img) : ${{ env.MD5_IMG }}
          MD5 (zip) : ${{ env.MD5_ZIP }}
